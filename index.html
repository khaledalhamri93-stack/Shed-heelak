<title>شد حيلك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first game shell — HUD bar on top, pixel-framed panels stacked in one column (two on wide screens), fixed bottom nav */
:root{
  --lav:#cbbfe9; --lav-2:#bcaee2; --ink:#1d1633; --panel:#f7f3fe; --panel-2:#ece5fa;
  --term:#1f1b38; --term-2:#2d2852; --green:#6fd36a; --green-d:#3f9e3a; --gold:#f5c542; --gold-d:#c9921f;
  --red:#e8464f; --blue:#4f7be0; --cyan:#7fd3f7; --muted:#5d5480; --white:#ffffff;
  --f-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal',system-ui,sans-serif;
  --f-num:'Press Start 2P',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--lav);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--lav-2) 1.2px,transparent 1.3px);background-size:10px 10px;
  -webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-size:.72em;letter-spacing:0;direction:ltr;unicode-bidi:isolate}

#app{max-width:980px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--lav)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding-block:10px;background:var(--lav)}
.brand{font-family:var(--f-display);font-size:28px;line-height:1.1;margin-inline-end:auto;white-space:nowrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--term);color:var(--white);border:3px solid var(--ink);border-radius:8px;padding:5px 9px;box-shadow:0 3px 0 var(--ink)}
.chip canvas{width:18px;height:18px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);padding:0}
.iconbtn canvas{width:22px;height:22px}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* cards */
.card{background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:3px solid var(--ink)}
.card-h h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.3}
.dots{display:flex;gap:5px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--gold)}.dots i:nth-child(3){background:var(--green)}
.card-b{padding:14px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{font-family:var(--f-display);font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--green);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:11px 18px 9px;box-shadow:0 4px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:var(--gold)}.btn.blue{background:var(--blue);color:var(--white)}.btn.red{background:var(--red);color:var(--white)}.btn.ghost{background:var(--panel-2)}
.btn.sm{font-size:16px;padding:7px 12px 5px}
.btn[disabled]{background:#cfc9de;color:#7d7699;box-shadow:0 4px 0 #8b84a6;border-color:#8b84a6;cursor:not-allowed}
.btn.wide{width:100%}

/* hero scene */
.scene{position:relative;padding:8px;background:var(--term)}
.scene canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:6px;border:3px solid var(--ink);max-width:100%}
.hud{position:absolute;inset:16px 16px auto 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud .chip{box-shadow:0 3px 0 var(--ink)}
.lv{display:flex;flex-direction:column;gap:4px}
.bar{height:12px;background:var(--term-2);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.bar>b{display:block;height:100%;background:var(--green);border-inline-end:2px solid var(--ink)}
.light .bar{background:var(--white)}
.hearts{display:flex;gap:3px}.hearts canvas{width:22px;height:22px}
.bubble{position:absolute;inset:auto 16px 16px auto;max-width:min(62%,330px);background:var(--term);color:var(--white);border:3px solid var(--ink);border-radius:8px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
.bubble .t{color:var(--cyan);font-size:13px}
.bubble .n{font-family:var(--f-display);font-size:18px;line-height:1.3}
@media (max-width:480px){.bubble{position:static;max-width:none;margin-top:8px}.hud .chip{padding:3px 6px}}

/* world path */
.path{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;padding:6px 2px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;text-align:center}
.node .c{position:relative;width:min(66px,15vw);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);overflow:hidden}
.node .c canvas{width:70%;height:70%}
.node .k{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-size:9px}
.node .l{font-family:var(--f-display);font-size:15px;line-height:1.2}
.node.locked .c{filter:grayscale(1) brightness(.85)}
.node.cur .c{outline:3px dashed var(--ink);outline-offset:3px}
.arrow{align-self:center;margin-top:-24px;font-family:var(--f-num);font-size:12px;color:var(--ink)}

/* progress */
.prog{display:flex;gap:14px;align-items:center}
.avatar{width:84px;height:84px;flex:none;background:linear-gradient(var(--cyan),#a9e3fb);border:3px solid var(--ink);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.avatar canvas{width:64px;height:auto}
.prog .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{border:3px solid var(--ink);border-radius:8px;background:var(--white);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile canvas{width:28px;height:28px}
.tile .v{font-family:var(--f-num);font-size:15px;direction:ltr}
.tile .s{font-size:12px;font-weight:700;color:var(--muted)}

/* terminal list */
.term{background:var(--term);color:#e8e4ff;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.term .bar-top{background:var(--panel-2);border-bottom:3px solid var(--ink);padding:5px 8px}
.term ul{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.term li{display:flex;gap:10px;align-items:baseline;font-weight:700}
.term li .num{color:var(--cyan)}.term li .pts{margin-inline-start:auto;color:var(--gold);font-family:var(--f-num);font-size:10px;direction:ltr}
.term li.done{color:#8f88b3;text-decoration:line-through}
.quest{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.check{width:34px;height:34px;flex:none;border:3px solid var(--ink);border-radius:6px;background:var(--green);display:grid;place-items:center}
.check canvas{width:22px;height:22px}
.quest p{margin:0;font-weight:800;font-size:16px}

/* tasks */
.summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.summary .big{font-family:var(--f-num);font-size:22px;direction:ltr}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-display);font-size:16px;padding:6px 14px 4px;border:3px solid var(--ink);border-radius:999px;background:var(--panel)}
.pill[aria-pressed="true"]{background:var(--term);color:var(--white)}
.period{font-family:var(--f-display);font-size:20px;margin:6px 4px -6px;display:flex;align-items:center;gap:8px}
.period canvas{width:24px;height:24px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px dashed #cfc5ea}
.task:last-child{border-bottom:0}
.task .ic{width:44px;height:44px;flex:none;border:3px solid var(--ink);border-radius:8px;background:var(--panel-2);display:grid;place-items:center}
.task .ic canvas{width:30px;height:30px}
.task .mid{flex:1;min-width:0}
.task .nm{font-weight:800;font-size:16px;line-height:1.35}
.task .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.tag{border:2px solid var(--ink);border-radius:4px;padding:0 6px;font-size:11px;font-weight:800;background:var(--white)}
.tag.sp{background:var(--gold)}
.task .act{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.task .p{font-family:var(--f-num);font-size:10px;direction:ltr;color:var(--ink)}
.task.done{background:#e6f7e3}
.task.done .nm{color:#4b7a47}
.wait{font-size:12px;font-weight:800;background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;text-align:center;line-height:1.3}

/* worlds */
.world{overflow:hidden}
.world .thumb{position:relative;border-bottom:3px solid var(--ink)}
.world .thumb canvas{width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.world .ribbon{position:absolute;top:10px;right:10px;font-family:var(--f-display);font-size:16px;background:var(--term);color:var(--white);border:3px solid var(--ink);border-radius:6px;padding:3px 10px 1px}
.world .lock{position:absolute;inset:0;background:rgba(29,22,51,.55);display:grid;place-items:center;color:var(--white);text-align:center}
.world .lock .cost{font-family:var(--f-display);font-size:24px;display:flex;align-items:center;gap:6px;justify-content:center}
.world .lock canvas{width:40px;height:40px;margin:0 auto 4px}
.world h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.world p{margin:2px 0 10px;color:var(--muted);font-weight:700}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stbar{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}.stbar b{font-size:11px}
.stage.boss{border-style:double;border-width:5px;padding:6px 2px}
.stage{border:3px solid var(--ink);border-radius:8px;background:var(--white);padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--ink)}
.stage .sn{font-size:13px;padding:2px 0 4px}
.stage .st{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:-1px}
.stage.clear .st{color:var(--gold-d)}.stage{padding:8px 2px}
.stage.clear{background:#e6f7e3}.stage.next{background:var(--gold)}.stage[disabled]{opacity:.5;cursor:not-allowed}
.reward{display:flex;gap:10px;align-items:center;margin-top:12px;padding:8px 10px;border:2px dashed var(--ink);border-radius:8px;font-weight:700;font-size:14px}
.reward canvas{width:52px;height:auto}
.need{font-size:13px;font-weight:800;margin-top:6px;color:var(--white)}

/* shop */
.preview{display:flex;gap:16px;align-items:center}
.preview .stagebox{width:130px;height:130px;flex:none;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(var(--cyan) 70%,var(--green) 70%);display:grid;place-items:center}
.preview .stagebox canvas{width:84px;height:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{border:3px solid var(--ink);border-radius:10px;background:var(--white);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .pic{width:100%;height:84px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;border:2px solid var(--ink)}
.item .pic{height:100px}.item .pic canvas{width:84px;height:auto}
.item .in{font-family:var(--f-display);font-size:17px;line-height:1.2}
.item .pk{font-size:12px;font-weight:700;color:var(--muted);min-height:18px}
.item.eq{background:#fff6d6}
.price{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:11px}
.price canvas{width:16px;height:16px}

/* friends */
.track{position:relative;padding:8px 4px 4px}
.lane{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lane .col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.lane .wbase{width:100%;padding:6px 2px 4px;border:3px solid var(--ink);border-radius:8px;text-align:center;font-family:var(--f-display);font-size:13px;line-height:1.2}
.lane .ppl{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:44px;align-items:flex-end}
.lane .ppl canvas{width:26px;height:auto}
.rank{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px dashed #cfc5ea}
.rrow:last-child{border-bottom:0}
.rrow.me{background:#fff6d6}
.rrow .pos{font-family:var(--f-num);font-size:13px;width:26px;text-align:center}
.rrow .av{width:44px;height:44px;flex:none;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(var(--cyan),#a9e3fb);display:grid;place-items:center}
.rrow .av canvas{width:40px;height:auto}
.rrow .who{flex:1;min-width:0}
.rrow .who b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block;line-height:1.2}
.rrow .who span{font-size:12px;font-weight:700;color:var(--muted)}
.rrow .wk{font-family:var(--f-num);font-size:11px;direction:ltr;text-align:center}
.code{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code .c{font-family:var(--f-num);font-size:14px;background:var(--term);color:var(--gold);border:3px solid var(--ink);border-radius:8px;padding:10px 12px;direction:ltr;user-select:all}
.note{font-size:13px;color:var(--muted);font-weight:700;margin:8px 0 0}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--term);border-top:3px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:#b9b2da;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-family:var(--f-display);font-size:15px}
.nav button canvas{width:26px;height:26px;opacity:.75}
.nav button[aria-current="page"]{color:var(--gold)}
.nav button[aria-current="page"] canvas{opacity:1;transform:translateY(-2px)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:57;background:rgba(29,22,51,.7);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{width:min(520px,100%)}
.modal .card-b{display:flex;flex-direction:column;gap:12px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad .btn{font-family:var(--f-num);font-size:18px;padding:14px 0}
.pindots{display:flex;gap:12px;justify-content:center;direction:ltr}
.pindots i{width:18px;height:18px;border:3px solid var(--ink);border-radius:4px;display:block;background:var(--white)}
.pindots i.f{background:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
.field input,.field select{font:inherit;font-weight:700;padding:9px 10px;border:3px solid var(--ink);border-radius:8px;background:var(--white);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--white)}
.prow .nm{flex:1;min-width:0;font-weight:800}
.prow canvas{width:24px;height:24px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.switch input{width:22px;height:22px;accent-color:var(--green-d)}
.sec{font-family:var(--f-display);font-size:19px;margin:6px 0 -4px}
.center{text-align:center}
.celebrate{font-family:var(--f-display);font-size:30px;line-height:1.2;color:var(--gold);text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),3px 3px 0 var(--ink)}

/* title screen */
#title{position:fixed;inset:0;z-index:60;background:var(--lav);background-image:radial-gradient(var(--lav-2) 1.2px,transparent 1.3px);background-size:10px 10px;overflow-y:auto;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#title .tl{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.logo,.brand{color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.brand{-webkit-text-stroke:2px var(--ink);text-shadow:0 3px 0 var(--ink)}
#title .logo{font-family:var(--f-display);font-size:clamp(68px,19vw,118px);line-height:1.05;animation:bob 2.4s steps(4) infinite}
#title .tsub{font-family:var(--f-display);font-size:19px;color:var(--white);background:var(--term);border:3px solid var(--ink);border-radius:8px;padding:6px 14px 3px;box-shadow:0 3px 0 var(--ink)}
#title .tframe,#title .tpathc{width:100%}
#title .tpathc .path{padding:12px 8px}
#title .btn{font-size:28px;padding:15px 40px 11px;box-shadow:0 6px 0 var(--ink)}
#title .tfeat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#title .tfeat span{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:4px 12px}
#title .tfeat canvas{width:18px;height:18px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.35}}

/* stage map */
.snodes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin-top:4px;padding:10px 4px;background:repeating-linear-gradient(90deg,transparent 0 10px,#cfc5ea 10px 16px) 0 52px/100% 3px no-repeat}
.snode{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;min-width:0}
.snode .o{position:relative;width:min(62px,16vw);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--white);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.snode .o canvas{width:55%;height:55%}
.snode .o .k{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 3px;border-radius:6px;background:var(--term);color:var(--white);border:2px solid var(--ink);display:grid;place-items:center;font-size:8px}
.snode .nm{font-weight:800;font-size:12px;line-height:1.25;text-align:center}
.snode .sr{font-size:12px;color:var(--gold-d);letter-spacing:-1px;min-height:16px;font-weight:800}
.snode.done .o{background:#e6f7e3}
.snode.cur .o{background:var(--gold);animation:pulse 1.2s steps(2) infinite}
.snode.boss .o{border-width:5px;border-style:double;background:#ffd9d9}
.snode.boss.done .o{background:#e6f7e3}
.snode.locked{opacity:.5}
@keyframes pulse{50%{transform:scale(1.08)}}
.feat{display:flex;gap:6px;flex-wrap:wrap}
.stars{font-size:34px;line-height:1;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:4px}

function award(p,why){
  const before=level();S.points+=p;S.xp+=p;S.log[S.day]=(S.log[S.day]||0)+p;const gg=Math.max(1,Math.round(p/3));S.gold=(S.gold||0)+gg;
  toast(`+${p} نقطة و+${gg} عملة · ${why}`,'star');
  if(level()>before){setTimeout(()=>{SFX.win();modal(`<div class="center celebrate">المستوى ${level()}!</div><div class="center">${hero(S.look,4)}</div><p class="center" style="font-weight:800;margin:0">${gx('ارتفع مستواك يا بطل. استمر!','ارتفع مستواكِ يا بطلة. استمري!')}</p><button class="btn wide gold" data-close>رائع</button>`)},400)}
  const all=S.tasks.every(t=>t.status==='done');
  if(all&&S.bonusDay!==S.day){S.bonusDay=S.day;S.points+=20;S.xp+=20;S.gems+=25;S.log[S.day]+=20;setTimeout(()=>toast('صندوق اليوم الكامل: +20 نقطة و+25 جوهرة','gift'),700)}
}
function markDone(id){
  const t=S.tasks.find(x=>x.id===id);if(!t||t.status!=='todo')return;
  if(S.auto){t.status='done';award(t.pts,t.name);SFX.done()}else{t.status='pending';SFX.click();toast('أُرسلت لولي الأمر للموافقة','clock')}
  save();render();
}
function approve(id,ok){const t=S.tasks.find(x=>x.id===id);if(!t)return;if(ok){t.status='done';award(t.pts,t.name);SFX.done()}else t.status='todo';save();render();parentPanel()}
function unlockWorld(i){const w=WORLDS[i];if(S.points<w.cost)return;S.points-=w.cost;S.unlocked[i]=true;save();SFX.win();render();
  modal(`<div class="center celebrate">فُتحت منطقة جديدة!</div><canvas data-world="${i}" width="320" height="180" style="width:100%;height:auto;border:3px solid var(--ink);border-radius:8px"></canvas><p class="center" style="font-weight:800;margin:0">${w.name}: ${w.desc}</p><button class="btn wide gold" data-play="${i*PER}">▶ ${gx('ابدأ','ابدئي')} المرحلة الأولى</button>`)}
function buy(id){const it=ITEM_BY_ID[id];if(!it||S.gems<it.price)return;S.gems-=it.price;S.owned.push(id);equip(id,true);SFX.buy();toast(gx('اشتريت ','اشتريتِ ')+it.name,'gem')}
function equip(id,silent){const it=ITEM_BY_ID[id];const slot=CAT_SLOT[it.cat];S.look[slot]=it.cat==='char'?it.look.char:id;save();if(!silent)SFX.click();render()}

function setGender(g){
  S.gender=g;const gt=genTasks(g,S.nextId||100);S.nextId=gt.id;
  S.tasks=S.tasks.filter(t=>!t.def).concat(gt.t);
  const it=ITEMS.find(i=>i.cat==='char'&&i.look.char===S.look.char);
  if(it&&it.g!==g)S.look.char=g==='f'?'advg':'adv';
}

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dth(x,y){return(BAY[((y&3)<<2)+(x&3)]+.5)/16}
function hsh(n){n=Math.imul(n|0,374761393);n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296}
function hsh2(x,y,s){return hsh((x|0)*73856093^(y|0)*19349663^((s||0)|0)*83492791)}
function vn2(x,y,s,P){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,su=u*u*(3-2*u),sv=v*v*(3-2*v);const w=i=>P?((i%P)+P)%P:i;
  const a=hsh2(w(xi),yi,s),b=hsh2(w(xi+1),yi,s),c=hsh2(w(xi),yi+1,s),d=hsh2(w(xi+1),yi+1,s);return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv}

function lerpA(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}

    else if((el==='lightning'||el==='storm')&&Math.random()<.18)P({t:'bolt',pts:jag(x,y,x+rnd(-6,6),y+rnd(-6,6),3),life:5,col:el});
    else if(el==='ice'||el==='crystal'||el==='holy'||el==='cosmic')Math.random()<.4&&P({t:'star',x,y,vx:0,vy:rnd(-.3,.1),drag:.96,life:rnd(12,20),col:el==='ice'?'ice':el,s:rnd(.8,1.5)});
    else if(el==='arcane')P({t:'glow',x,y,vx:rnd(-.3,.3),vy:rnd(-.5,0),drag:.96,life:rnd(12,20),col:ELC.arcane[2],s:1.6});
    else if(el==='wind'||el==='sand')Math.random()<.3&&P({t:'streak',x,y,vx:-G.face*rnd(.6,1.4)-G.vx*.5,vy:0,drag:.95,life:14,col:ELC[el][2],s:3});
    else if(el==='earth')Math.random()<.15&&P({t:'rock',x,y,vx:rnd(-.2,.2),vy:0,g:.12,drag:.99,life:30,col:ELC.earth[3],s:.8})}
  // projectiles
  if(G.proj){for(const p of G.proj){p.t+=dt;p.life-=dt;if(p.ax){p.vx+=p.ax*dt}p.vy+=(p.g||0)*dt;
      if(p.homing){const T=targets().filter(T=>!p.hit.has(T.o)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(T&&Math.hypot(T.x-p.x,T.y-p.y)<180){const a=Math.atan2(T.y-p.y,T.x-p.x),sp=Math.hypot(p.vx,p.vy)||3;p.vx+=(Math.cos(a)*sp-p.vx)*.08*dt;p.vy+=(Math.sin(a)*sp-p.vy)*.08*dt}}

function lifeIsland(si,I,sites,props,people,R){const b=STAGES[si].b;
  // convert houses into buildable plots
  for(let i=props.length-1;i>=0;i--){const p=props[i];if(p.k!=='house'||(p.kind!=='cottage'&&p.kind!=='house'))continue;if(Math.abs(p.x)<700||R()<.55){props.splice(i,1);sites.push({k:'plot',x:p.x,lvl:Math.abs(p.x)<700?0:(R()<.5?0:1),paid:0,build:-1,v:p.v||0})}}
  // ferries: every other river becomes wide with a boat
  const rivers=props.filter(r=>r.k==='river').sort((a,b2)=>a.x-b2.x);rivers.forEach((r,i)=>{if(i%2===1||rivers.length===1&&si%2){const nw=180;if(!sites.some(s=>Math.abs(s.x-r.x)<nw/2+40)){r.ferry=1;r.w=nw;r.bx=r.x-nw/2+12}}});
  for(let i=props.length-1;i>=0;i--){const p=props[i];if(['tree','grass','boulder','rabbit','house','camp','chest','ruins','wheat','fence','hay','windmill','crag'].includes(p.k)&&rivers.some(r=>r.ferry&&Math.abs(p.x-r.x)<r.w/2+(p.w?p.w/2:0)+20))props.splice(i,1)}
  for(const p of props)if(p.k==='beast'){const fr=rivers.find(r=>r.ferry&&Math.abs(p.x-r.x)<r.w/2+10);if(fr){p.x=p.x0=fr.x+fr.w/2+30}}
  // village clusters: wells, statues, sheep, guards
  const xs=sites.filter(s=>s.k==='plot').map(s=>s.x).concat(props.filter(p=>p.k==='house').map(p=>p.x)).sort((a,b2)=>a-b2);const cl=[];xs.forEach(x=>{const c2=cl[cl.length-1];if(c2&&x-c2[c2.length-1]<160)c2.push(x);else cl.push([x])});
  const busyAt=(x,m)=>sites.some(s=>Math.abs(s.x-x)<m)||props.some(p=>['house','river','portal','lair','camp','chest','ruins','shrine','well','statue2'].includes(p.k)&&Math.abs(p.x-x)<(p.k==='river'?p.w/2+m:m));
  cl.forEach((c2,ci)=>{const cx=(c2[0]+c2[c2.length-1])/2;for(const dx of [46,-46,92,-92,0]){const x=Math.round(cx+dx);if(!busyAt(x,22)){props.push({k:'well',x});break}}
    if(c2.length>1||R()<.5)for(const dx of [-70,70,120,-120]){const x=Math.round(cx+dx);if(!busyAt(x,26)){props.push({k:'statue2',x});break}}
    if(b!==3&&ci%2===0)for(let k=0;k<2;k++){const x=Math.round(cx+(R()-.5)*160);props.push({k:'sheep',x,x0:x,hp:1,alive:1,t:R()*99,dir:1})}
    for(let k=0;k<2;k++){const g=mkP('guard',cx+(k?24:-24));g.home=cx;g.hp=4;people.push(g)}});
  for(const z of (props._zones||[]))if(z.t==='forest'&&b!==3)for(let k=0;k<2;k++){const x=Math.round(z.x0+(z.x1-z.x0)*(.2+R()*.6));props.push({k:'deer',x,x0:x,hp:2,alive:1,t:R()*99,dir:1})}
  for(let k=0;k<2;k++){const g=mkP('guard',k?60:-60);g.home=k?120:-120;g.hp=4;people.push(g)}
  // mount shrine
  const m=MLIST[si%MLIST.length];for(let k=0;k<30;k++){const x=(si%2?-1:1)*Math.round(760+k*47+R()*40);if(Math.abs(x)<I.half-600&&!busyAt(x,40)){props.push({k:'shrine',x,m});break}}}
